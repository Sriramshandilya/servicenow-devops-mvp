name: CI/CD Pipeline with ServiceNow Change

on:
  push:
    branches:
      - main

jobs:

  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - name: Planning stage
        run: |
          echo "📋 Planning deployment..."
          echo "Checking scope, impact, dependencies"
          sleep 5
          echo "✅ Plan completed"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - name: Build stage
        run: |
          echo "🏗️ Building application..."
          sleep 5
          echo "✅ Build successful"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test stage
        run: |
          echo "🧪 Running tests..."
          sleep 5
          echo "✅ Tests passed"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ServiceNow DevOps Change (Async)
        uses: ServiceNow/servicenow-devops-change@main
        with:
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          job-name: Deploy to Production
          deployment-gate: false   # THIS IS THE KEY to control the approval needed or not
          callback-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          orchestration-task-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          context-github: |
            {
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "workflow": "${{ github.workflow }}",
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "server_url": "${{ github.server_url }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

          # 🔑 Async / Non-blocking
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: false
          changeCreationTimeout: 10

      - name: Simulate deployment
        run: |
          echo "🚀 Deploying application..."
          sleep 5
          echo "✅ Deployment completed"

